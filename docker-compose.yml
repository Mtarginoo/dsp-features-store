services:
  # 1. PostgreSQL: The Relational Feature Store
  postgres:
    image: postgres:15-alpine
    container_name: ml_postgres
    environment:
      POSTGRES_USER: ml_user
      POSTGRES_PASSWORD: ml_password
      POSTGRES_DB: feature_store
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ml_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ml_user -d feature_store"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MinIO: The Object Store for the Claim Check pattern (Simulates AWS S3)
  minio:
    image: minio/minio:latest
    container_name: ml_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API (Where Python and Go will connect)
      - "9001:9001" # Web Console (For viewing files via browser)
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - ml_network

  # 3. Kafka (KRaft mode - no Zookeeper): The Event Bus
  kafka:
    image: apache/kafka:3.7.0
    container_name: ml_kafka
    user: root
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ml_network

  # 4. Kafdrop: UI to visualize Kafka topics and messages
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: ml_kafdrop
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
    ports:
      - "9090:9000" # Mapped to 9090 to avoid conflict with the MinIO API
    networks:
      - ml_network
   # 5. MinIO Init: Creates the bucket on first boot and exits
  minio-init:
    image: minio/mc:latest
    container_name: ml_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/audio-chunks &&
      echo 'Bucket audio-chunks ready.'
      "
    networks:
      - ml_network
    restart: on-failure

volumes:
  pg_data:
  minio_data:
  kafka_data:

networks:
  ml_network:
    driver: bridge