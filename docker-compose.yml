version: '3.8'

services:
  # 1. PostgreSQL: Relational Features Store
  postgres:
    image: postgres:15-alpine
    container_name: ml_postgres
    environment:
      POSTGRES_USER: ml_user
      POSTGRES_PASSWORD: ml_password
      POSTGRES_DB: feature_store
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ml_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ml_user -d feature_store"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MinIO: Object store (Simulate AWS S3)
  minio:
    image: minio/minio:latest
    container_name: ml_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web Console
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - ml_network

  # 3. Kafka
  kafka:
    image: bitnami/kafka:3.5
    container_name: ml_kafka
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_BROKER_ID: 1
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - ml_network

  # 4. Kafdrop: UI to visualize topics and Kafka's messages
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: ml_kafdrop
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
    ports:
      - "9090:9000"
    networks:
      - ml_network

volumes:
  pg_data:
  minio_data:
  kafka_data:

networks:
  ml_network:
    driver: bridge